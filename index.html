<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#3C3489">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="M2F Planning">
<title>Mood2Fit — Planning</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
:root{
  --prod:#3C3489;--prod-bg:#EEEDFE;
  --insta:#72243E;--insta-bg:#FBEAF0;
  --biz:#712B13;--biz-bg:#FAECE7;
  --li:#0C447C;--li-bg:#E6F1FB;
  --ops:#27500A;--ops-bg:#EAF3DE;
  --admin:#633806;--admin-bg:#FAEEDA;
  --deca:#5F5E5A;--deca-bg:#F1EFE8;
  --cours:#7A4500;--cours-bg:#FEF3E2;
  --text:#1a1a1a;--text2:#555;--text3:#999;
  --bg:#f8f7f5;--card:#fff;--border:#e8e6e0;
  --r:12px;--rs:8px;
}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding-bottom:20px;}

/* HEADER */
.hdr{background:#3C3489;color:#fff;padding:14px 16px 10px;position:sticky;top:0;z-index:100;box-shadow:0 2px 8px #3C348940;}
.hdr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px;}
.hdr h1{font-size:16px;font-weight:700;}
.gcal-btn{background:#ffffff20;border:none;color:#fff;font-size:11px;font-weight:600;padding:5px 12px;border-radius:20px;cursor:pointer;}
.gcal-btn.ok{background:#1D9E7540;}
.wnav{display:flex;align-items:center;gap:10px;}
.wnav button{background:#ffffff25;border:none;color:#fff;width:28px;height:28px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;}
.wlbl{font-size:12px;font-weight:600;}

/* TABS */
.tabs{display:flex;background:#fff;border-bottom:1px solid var(--border);position:sticky;top:62px;z-index:90;}
.tab{flex:1;padding:10px 4px;text-align:center;font-size:12px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;}
.tab.on{color:#3C3489;border-bottom-color:#3C3489;}

/* PAGES */
.pg{display:none;padding:14px;}
.pg.on{display:block;}
.slbl{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px;}

/* BLOC GRID */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
.bcard{border-radius:var(--r);padding:11px 12px 9px;cursor:pointer;border:2px solid transparent;user-select:none;-webkit-user-select:none;transition:transform .1s;}
.bcard:active{transform:scale(.97);}
.bcard.sel{border-color:var(--sc)!important;box-shadow:0 0 0 3px var(--ss);}
.bt{font-size:12px;font-weight:700;margin-bottom:2px;}
.bs{font-size:10px;opacity:.7;line-height:1.3;}
.bd{font-size:10px;font-weight:600;margin-top:4px;}
.bb{display:inline-block;font-size:9px;font-weight:700;padding:2px 8px;border-radius:20px;margin-top:4px;}

/* PICKER */
.picker{background:#fff;border-radius:var(--r);border:2px solid var(--pc,#ccc);padding:14px;margin-bottom:14px;display:none;}
.picker.on{display:block;}
.ptitle{font-size:13px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;}
.pdot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.pscroll{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px;-webkit-overflow-scrolling:touch;}
.pscroll::-webkit-scrollbar{display:none;}
.pday{flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:5px;min-width:60px;}
.pdlbl{font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.04em;}
.pslot{font-size:11px;padding:7px 10px;border-radius:var(--rs);border:1.5px solid var(--border);background:#fafafa;color:var(--text2);cursor:pointer;text-align:center;width:100%;}
.pslot:active{background:#f0eeea;}
.pslot.taken{background:#f0eeea;color:#ccc;text-decoration:line-through;cursor:default;font-style:italic;}
.pslot.blocked{color:#ddd;cursor:default;font-style:italic;}
.pcancel{margin-top:10px;font-size:12px;color:var(--text3);cursor:pointer;text-decoration:underline;display:inline-block;}

/* GRILLE */
.wgrid{background:#fff;border-radius:var(--r);border:1px solid var(--border);overflow:hidden;margin-bottom:14px;}
.wrow{display:grid;grid-template-columns:42px repeat(7,1fr);}
.wrow+.wrow{border-top:1px solid #f0eeea;}
.whdr .wcell{background:#fafafa;font-size:9px;font-weight:700;color:var(--text3);padding:6px 2px;}
.wlbl2{font-size:8px;color:var(--text3);display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;transform:rotate(180deg);background:#fafafa;border-right:1px solid var(--border);}
.wcell{min-height:52px;padding:3px 2px;display:flex;align-items:center;justify-content:center;text-align:center;border-right:1px solid #f5f3ef;position:relative;cursor:pointer;}
.wcell:last-child{border-right:none;}
.wcell.empty{cursor:default;}
.cin{border-radius:5px;padding:3px 2px;width:100%;}
.ctitle{font-size:8px;font-weight:700;line-height:1.3;}
.crm{position:absolute;top:2px;right:2px;font-size:12px;color:#ccc;cursor:pointer;font-weight:700;line-height:1;}

/* ACTIONS */
.abar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.btn{padding:10px 16px;border-radius:var(--rs);border:none;font-size:12px;font-weight:700;cursor:pointer;display:flex;align-items:center;gap:6px;}
.btn:active{opacity:.85;}
.btn-p{background:#3C3489;color:#fff;}
.btn-s{background:#fff;color:#3C3489;border:2px solid #3C3489;padding:8px 14px;}
.btn-g{background:#1D9E75;color:#fff;}

/* TASKS */
.tpanel{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:14px;margin-bottom:14px;display:none;}
.ttitle{font-size:13px;font-weight:700;margin-bottom:10px;display:flex;align-items:center;gap:8px;}
.titem{font-size:12px;color:var(--text2);padding:5px 0;border-bottom:1px solid #f5f3ef;display:flex;gap:6px;line-height:1.4;}
.titem:last-child{border-bottom:none;}
.titem::before{content:"→";color:var(--text3);flex-shrink:0;}

/* HOURS */
.hcard{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:14px;margin-bottom:14px;}
.hrow{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid #f5f3ef;}
.hrow:last-child{border-bottom:none;}
.hdot{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.hlbl{flex:1;font-size:12px;color:var(--text2);}
.hbar{flex:2;height:6px;background:#f0eeea;border-radius:3px;overflow:hidden;}
.hfill{height:100%;border-radius:3px;}
.hval{font-size:12px;font-weight:700;min-width:30px;text-align:right;}
.htotal{display:flex;justify-content:space-between;font-size:13px;font-weight:700;margin-top:10px;padding-top:10px;border-top:1px solid var(--border);}

/* HIST */
.hweek{background:#fff;border-radius:var(--r);border:1px solid var(--border);padding:14px;margin-bottom:10px;}
.hwtitle{font-size:13px;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center;}
.chips{display:flex;flex-wrap:wrap;gap:5px;}
.chip{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:700;}

/* BANNER */
.banner{border-radius:var(--rs);padding:10px 14px;margin-bottom:12px;font-size:12px;display:none;}
.banner.on{display:block;}
.banner.ok{background:#EAF3DE;color:#27500A;border:1px solid #97C459;}
.banner.err{background:#FBEAF0;color:#72243E;border:1px solid #ED93B1;}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(16px);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:var(--r);font-size:12px;font-weight:600;opacity:0;transition:all .3s;pointer-events:none;z-index:999;white-space:nowrap;max-width:90vw;}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0);}

.empty{text-align:center;padding:40px 20px;color:var(--text3);font-size:13px;line-height:1.7;}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <h1>📱 Mood2Fit Planning</h1>
    <button class="gcal-btn" id="gcal-btn" onclick="handleAuth()">Connecter Google Agenda</button>
  </div>
  <div class="wnav">
    <button onclick="changeWeek(-1)">‹</button>
    <span class="wlbl" id="wlbl"></span>
    <button onclick="changeWeek(1)">›</button>
  </div>
</div>

<div class="tabs">
  <div class="tab on" onclick="showTab('plan',this)">📅 Semaine</div>
  <div class="tab" onclick="showTab('hours',this)">⏱ Heures</div>
  <div class="tab" onclick="showTab('hist',this)">📊 Historique</div>
</div>

<div class="pg on" id="pg-plan">
  <div class="banner" id="banner"></div>
  <p class="slbl">1 — Clique sur un bloc pour choisir son créneau</p>
  <div class="bgrid" id="bgrid"></div>

  <div class="picker" id="picker">
    <div class="ptitle"><div class="pdot" id="pdot"></div><span id="ptxt"></span></div>
    <div class="pscroll" id="pdays"></div>
    <span class="pcancel" onclick="closePicker()">Annuler</span>
  </div>

  <p class="slbl">2 — Ta semaine</p>
  <div class="wgrid">
    <div class="wrow whdr">
      <div class="wcell" style="background:#fafafa;border-right:1px solid var(--border);"></div>
      <div class="wcell" id="dh0"></div><div class="wcell" id="dh1"></div>
      <div class="wcell" id="dh2"></div><div class="wcell" id="dh3"></div>
      <div class="wcell" id="dh4"></div><div class="wcell" id="dh5"></div>
      <div class="wcell" id="dh6"></div>
    </div>
    <div class="wrow" id="row-mat">
      <div class="wlbl2">Matin</div>
      <div class="wcell empty" id="c0m"></div><div class="wcell empty" id="c1m"></div>
      <div class="wcell empty" id="c2m"></div><div class="wcell empty" id="c3m"></div>
      <div class="wcell empty" id="c4m"></div><div class="wcell empty" id="c5m"></div>
      <div class="wcell empty" id="c6m"></div>
    </div>
    <div class="wrow" id="row-apm">
      <div class="wlbl2">Après-m.</div>
      <div class="wcell empty" id="c0a"></div><div class="wcell empty" id="c1a"></div>
      <div class="wcell empty" id="c2a"></div><div class="wcell empty" id="c3a"></div>
      <div class="wcell empty" id="c4a"></div><div class="wcell empty" id="c5a"></div>
      <div class="wcell empty" id="c6a"></div>
    </div>
  </div>

  <div class="tpanel" id="tpanel">
    <div class="ttitle"><div class="pdot" id="tdot"></div><span id="ttxt"></span></div>
    <div id="tlist"></div>
  </div>

  <div class="abar">
    <button class="btn btn-p" onclick="validateWeek()">✅ Valider la semaine</button>
    <button class="btn btn-s" onclick="clearWeek()">🗑 Vider</button>
  </div>
</div>

<div class="pg" id="pg-hours">
  <div class="hcard">
    <div style="font-size:13px;font-weight:700;margin-bottom:12px;">⏱ Heures cette semaine</div>
    <div id="hcontent"><div class="empty">Remplis ta semaine<br>pour voir les heures.</div></div>
  </div>
</div>

<div class="pg" id="pg-hist">
  <div id="hcontent2"><div class="empty">Valide des semaines<br>pour voir l'historique.</div></div>
</div>

<div class="toast" id="toast"></div>

<script>
// ══ CONFIG ══════════════════════════════════════════════
const CLIENT_ID   = 'COLLE_TON_CLIENT_ID_ICI.apps.googleusercontent.com';
const REDIRECT    = window.location.origin + window.location.pathname;
const SCOPES      = 'https://www.googleapis.com/auth/calendar.events';
const GCAL        = 'https://www.googleapis.com/calendar/v3';

// ══ DONNÉES ═════════════════════════════════════════════
const DAYS = ['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];

const META = {
  prod1:{ label:'Produit J1',  short:'Prod.J1', cls:'prod',  dot:'#7F77DD', full:true,  halves:['mat','apm'] },
  prod2:{ label:'Produit J2',  short:'Prod.J2', cls:'prod',  dot:'#7F77DD', full:true,  halves:['mat','apm'] },
  biz:  { label:'Commercial',  short:'Commer.', cls:'biz',   dot:'#D85A30', full:false, halves:['mat','apm'] },
  insta:{ label:'Instagram',   short:'Insta',   cls:'insta', dot:'#D4537E', full:false, halves:['apm'] },
  li:   { label:'LinkedIn',    short:'LinkedIn',cls:'li',    dot:'#378ADD', full:false, halves:['mat'] },
  ops:  { label:'Site + NL',   short:'Site+NL', cls:'ops',   dot:'#639922', full:false, halves:['mat'] },
  admin:{ label:'Admin',       short:'Admin',   cls:'admin', dot:'#BA7517', full:false, halves:['apm'] },
  deca: { label:'Decathlon',   short:'Deca.',   cls:'deca',  dot:'#888780', full:false, halves:['mat','apm'] },
  cours:{ label:'Cours MIEE',  short:'Cours',   cls:'cours', dot:'#D4840A', full:false, halves:['mat','apm'] },
};

const BLOCS = [
  {k:'prod1', t:'📱 Produit — J1', s:'Dev Cursor · Expo · Supabase',    d:'Journée entière', b:'priorité 1'},
  {k:'prod2', t:'🗺️ Produit — J2', s:'Stratégie + dev après-midi',      d:'Journée entière', b:'priorité 1'},
  {k:'biz',   t:'📣 Commercial',   s:'Pitch · partenaires · coaching',  d:'½j ou journée',   b:'priorité 2'},
  {k:'insta', t:'📸 Instagram',    s:'Posts · stories · réels · KPIs',  d:'Après-midi (3h)', b:'priorité 2'},
  {k:'li',    t:'💼 LinkedIn',     s:'Post de fond · engagement',        d:'Matin (1h30)',     b:'priorité 3'},
  {k:'ops',   t:'🌐 Site + NL',    s:'mood2fit.com · Brevo · Sentry',   d:'Matin (2h)',       b:'priorité 3'},
  {k:'admin', t:'🧾 Admin',        s:'Urssaf · facturation · décla.',   d:'Après-midi (2h)', b:'priorité 3'},
  {k:'deca',  t:'🏪 Decathlon',    s:'CDI · 9h–14h ou 14h–20h30',      d:'Demi-journée',     b:'contraint'},
  {k:'cours', t:'🎓 Cours MIEE',   s:'Présentiel Créteil · ponctuel',   d:'Journée ou ½j',   b:'ponctuel'},
];

const HOURS = {prod1:7,prod2:7,biz:3.5,insta:3,li:1.5,ops:2,admin:2,deca:5.5,cours:7};

const TIMES = {
  mat:{s:'09:00',e:'13:30'}, apm:{s:'14:00',e:'20:30'}, full:{s:'09:00',e:'20:30'}
};

const TASKS = {
  prod1:{t:'Produit — Journée dev',      i:['Sprint Cursor : feature du jour (Trello)','Dev Expo / React Native : écran ou composant','Intégration Supabase · Edge Function · RLS','Tests simulateur iOS & Android','Commit + push + note Trello fin de journée']},
  prod2:{t:'Produit — Stratégie + dev',  i:['Matin : roadmap · backlog · arbitrages UX','Review feedback bêta-testeurs','Spec ou wireframe prochaine feature','Après-midi : implémentation des décisions','Déploiement ou test end-to-end si milestone']},
  biz:  {t:'Commercial',                 i:['Relances partenaires : gyms, coachs, marques','Préparation ou répétition pitch Mood2Fit','Prospection ambassadeurs & influenceurs fitness','Suivi deals · mise à jour Notion/CRM','Séances conseil/coaching étudiants']},
  insta:{t:'Instagram',                  i:['Visuels posts (Canva · templates)','Rédaction captions + hashtags','Tournage ou montage réels si prévu','Programmation semaine via Brevo / Later','Review KPIs : reach · saves · followers']},
  li:   {t:'LinkedIn',                   i:['1 post de fond (entrepreneuriat / Mood2Fit)','Répondre aux commentaires de la semaine','Engagement : réagir au contenu pertinent','Màj profil ou bannière si besoin']},
  ops:  {t:'Site + newsletter',          i:['Màj mood2fit.com (Vercel) · mentions légales','Rédaction newsletter mensuelle Brevo','Check Sentry : erreurs prod','Upstash Redis : monitoring','Analytics : trafic · conversions · bounce']},
  admin:{t:'Admin + compta',             i:['Déclaration Urssaf (si trimestre en cours)','Émission et suivi factures consulting','Compta micro-entreprise à jour','CPAM · Finances publiques si courrier','Archivage contrats et documents légaux']},
  deca: {t:'Decathlon (CDI)',            i:['Créneau 9h–14h ou 14h–20h30','Indisponible pour Mood2Fit','Trajet : podcast · réflexion produit']},
  cours:{t:'Cours / ateliers MIEE',      i:['Cours présentiel à Créteil (MIEE/UPEC)','Déplacement depuis Chatou à prévoir','Entrepreneuriat · stratégie · market research','Ateliers ponctuels selon planning']},
};

// ══ STATE ════════════════════════════════════════════════
let weekOffset = 0;
let allWeeks   = JSON.parse(localStorage.getItem('m2f_w') || '{}');
let validated  = JSON.parse(localStorage.getItem('m2f_v') || '[]');
let activeBloc = null;
let token      = localStorage.getItem('m2f_tok') || null;
let tokExp     = parseInt(localStorage.getItem('m2f_exp') || '0');

function wkey(o){ const m=monday(o); return m.toISOString().slice(0,10); }
function ws(o){ const k=wkey(o); if(!allWeeks[k]) allWeeks[k]={}; return allWeeks[k]; }
function save(){ localStorage.setItem('m2f_w', JSON.stringify(allWeeks)); }
function sid(di,h){ return 'c'+di+(h==='mat'?'m':'a'); }
function sk(di,h){ return di+'_'+h; }

function monday(o){
  const n=new Date(), d=n.getDay(), diff=d===0?-6:1-d;
  const m=new Date(n); m.setDate(n.getDate()+diff+o*7); m.setHours(0,0,0,0); return m;
}
function isoWeek(d){
  const u=new Date(Date.UTC(d.getFullYear(),d.getMonth(),d.getDate()));
  u.setUTCDate(u.getUTCDate()+4-(u.getUTCDay()||7));
  return Math.ceil((((u-new Date(Date.UTC(u.getUTCFullYear(),0,1)))/86400000)+1)/7);
}
function wlabel(o){
  const m=monday(o), s=new Date(m); s.setDate(m.getDate()+6);
  const f=d=>d.getDate()+'/'+(d.getMonth()+1);
  return 'S'+isoWeek(m)+' · '+f(m)+'–'+f(s);
}

// ══ AUTH PKCE ════════════════════════════════════════════
function tokenOk(){ return token && Date.now()<tokExp-60000; }

function handleAuth(){
  if(tokenOk()){ toast('✅ Déjà connecté à Google Agenda'); return; }
  pkceStart();
}

async function pkceStart(){
  const v=genV(), ch=await genCh(v);
  const st=btoa(Math.random().toString(36));
  sessionStorage.setItem('pkce_v',v);
  sessionStorage.setItem('pkce_s',st);
  sessionStorage.setItem('pkce_o',weekOffset);
  const p=new URLSearchParams({client_id:CLIENT_ID,redirect_uri:REDIRECT,response_type:'code',scope:SCOPES,code_challenge:ch,code_challenge_method:'S256',state:st,access_type:'online',prompt:'consent'});
  location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p;
}

async function pkceCallback(){
  const p=new URLSearchParams(location.search);
  const code=p.get('code'), st=p.get('state');
  if(!code) return;
  if(st!==sessionStorage.getItem('pkce_s')){ banner('Erreur sécurité OAuth','err'); return; }
  history.replaceState({},'',location.pathname);
  const v=sessionStorage.getItem('pkce_v');
  try{
    const r=await fetch('https://oauth2.googleapis.com/token',{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams({code,client_id:CLIENT_ID,redirect_uri:REDIRECT,grant_type:'authorization_code',code_verifier:v})});
    const d=await r.json();
    if(d.error) throw new Error(d.error_description||d.error);
    token=d.access_token; tokExp=Date.now()+d.expires_in*1000;
    localStorage.setItem('m2f_tok',token); localStorage.setItem('m2f_exp',tokExp);
    weekOffset=parseInt(sessionStorage.getItem('pkce_o')||'0');
    updateAuthBtn();
    banner('✅ Connecté ! Valide ta semaine pour envoyer vers Google Agenda.','ok');
  } catch(e){ banner('Erreur connexion : '+e.message,'err'); }
}

function genV(){ const a=new Uint8Array(32); crypto.getRandomValues(a); return btoa(String.fromCharCode(...a)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }
async function genCh(v){ const e=new TextEncoder().encode(v),h=await crypto.subtle.digest('SHA-256',e); return btoa(String.fromCharCode(...new Uint8Array(h))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=/g,''); }

function updateAuthBtn(){
  const b=document.getElementById('gcal-btn');
  if(tokenOk()){ b.className='gcal-btn ok'; b.textContent='● Google Agenda connecté'; }
  else { b.className='gcal-btn'; b.textContent='Connecter Google Agenda'; }
}

// ══ GOOGLE CALENDAR API ══════════════════════════════════
async function pushToGcal(state){
  if(!tokenOk()) return 0;
  const mon=monday(weekOffset), wk=wkey(weekOffset), added=new Set(), ps=[];
  let n=0;
  for(let di=0;di<7;di++){
    for(const h of['mat','apm']){
      const key=state[sk(di,h)]; if(!key) continue;
      const m=META[key], ek=key+'_'+di;
      if(m.full && added.has(ek)) continue; added.add(ek);
      const date=new Date(mon); date.setDate(mon.getDate()+di);
      const ds=date.toISOString().slice(0,10);
      const ti=m.full?TIMES.full:TIMES[h];
      const ev={summary:'[M2F] '+m.label+(m.full?' (journée)':h==='mat'?' (matin)':' (après-midi)'),description:TASKS[key].i.map(x=>'→ '+x).join('\n'),start:{dateTime:ds+'T'+ti.s+':00',timeZone:'Europe/Paris'},end:{dateTime:ds+'T'+ti.e+':00',timeZone:'Europe/Paris'},extendedProperties:{private:{m2f:'1',wk,bk:key}}};
      ps.push(fetch(GCAL+'/calendars/primary/events',{method:'POST',headers:{Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(ev)}).then(r=>{if(r.ok)n++;}));
    }
  }
  await Promise.all(ps); return n;
}

async function deleteWeek(wk){
  if(!tokenOk()) return;
  try{
    const r=await fetch(GCAL+'/calendars/primary/events?privateExtendedProperty=m2f%3D1&privateExtendedProperty=wk%3D'+wk+'&maxResults=50',{headers:{Authorization:'Bearer '+token}});
    const d=await r.json();
    if(!d.items) return;
    await Promise.all(d.items.map(ev=>fetch(GCAL+'/calendars/primary/events/'+ev.id,{method:'DELETE',headers:{Authorization:'Bearer '+token}})));
  }catch(e){}
}

// ══ RENDER BLOCS ════════════════════════════════════════

    li:   {sc:'#185FA5',ss:'#185FA530',bb_bg:'#B5D4F4',bb_c:'#042C53'},
    ops:  {sc:'#3B6D11',ss:'#3B6D1130',bb_bg:'#C0DD97',bb_c:'#173404'},

// ══ PICKER ══════════════════════════════════════════════
function openPicker(key){
  if(activeBloc===key){closePicker();return;}
  activeBloc=key;
  document.querySelectorAll('.bcard').forEach(b=>b.classList.remove('sel'));
  const card=document.getElementById('bc-'+key);
  if(card) card.classList.add('sel');
  const m=META[key], state=ws(weekOffset);
  document.getElementById('pdot').style.background=m.dot;
  document.getElementById('ptxt').textContent=m.label+' — Choisir un créneau';
  const picker=document.getElementById('picker');
  picker.style.setProperty('--pc',m.dot);
  const daysEl=document.getElementById('pdays'); daysEl.innerHTML='';
  DAYS.forEach((d,di)=>{
    const grp=document.createElement('div'); grp.className='pday';
    const lbl=document.createElement('div'); lbl.className='pdlbl'; lbl.textContent=d; grp.appendChild(lbl);
    if(m.full){
      const km=sk(di,'mat'),ka=sk(di,'apm');
      const mine=state[km]===key||state[ka]===key;
      const free=!state[km]&&!state[ka];
      const btn=document.createElement('div'); btn.className='pslot'+(mine?' taken':(!free?' blocked':''));
      btn.textContent=mine?'✓ Posé':'Journée';
      if(!mine&&free) btn.onclick=()=>{place(key,di,'full');closePicker();};
      grp.appendChild(btn);
    } else {
      m.halves.forEach(h=>{
        const k=sk(di,h), occ=state[k];
        const btn=document.createElement('div');
        btn.className='pslot'+(occ===key?' taken':(occ?' blocked':''));
        btn.textContent=occ===key?'✓'+(h==='mat'?' Mat':' Apm'):(h==='mat'?'Matin':'Après-m.');
        if(!occ) btn.onclick=()=>{place(key,di,h);closePicker();};
        grp.appendChild(btn);
      });
    }
    daysEl.appendChild(grp);
  });
  picker.classList.add('on');
  picker.scrollIntoView({behavior:'smooth',block:'nearest'});
}

function closePicker(){
  activeBloc=null;
  document.getElementById('picker').classList.remove('on');
  document.querySelectorAll('.bcard').forEach(b=>b.classList.remove('sel'));
}

// ══ PLACEMENT ═══════════════════════════════════════════
function place(key,di,h){
  const state=ws(weekOffset);
  if(h==='full'){state[sk(di,'mat')]=key;state[sk(di,'apm')]=key;}
  else state[sk(di,h)]=key;
  save(); renderGrid(); renderHours();
}

function remove(di,h){
  const state=ws(weekOffset), key=state[sk(di,h)]; if(!key) return;
  if(META[key].full){delete state[sk(di,'mat')];delete state[sk(di,'apm')];}
  else delete state[sk(di,h)];
  save(); renderGrid(); renderHours();
  document.getElementById('tpanel').style.display='none';
}

// ══ GRILLE ══════════════════════════════════════════════
function renderGrid(){
  const mon=monday(weekOffset);
  DAYS.forEach((d,i)=>{
    const dt=new Date(mon); dt.setDate(mon.getDate()+i);
    const el=document.getElementById('dh'+i);
    if(el){el.style.cssText='background:#fafafa;border-right:1px solid var(--border);';el.innerHTML=`<div style="font-size:9px;font-weight:700;color:var(--text3);text-align:center;padding:6px 2px;">${d}<br><span style="font-weight:400;font-size:8px;">${dt.getDate()}/${dt.getMonth()+1}</span></div>`;}
  });
  const state=ws(weekOffset);
  for(let di=0;di<7;di++){
    for(const h of['mat','apm']){
      const el=document.getElementById(sid(di,h)); if(!el) continue;
      const key=state[sk(di,h)];
      el.innerHTML=''; el.onclick=null;
      if(key){
        const m=META[key];
        el.className='wcell filled';
        el.innerHTML=`<div class="cin" style="background:var(--${m.cls}-bg)"><div class="ctitle" style="color:var(--${m.cls})">${m.short}</div></div><span class="crm" onclick="event.stopPropagation();remove(${di},'${h}')">×</span>`;
        el.onclick=()=>showTasks(key);
      } else {
        el.className='wcell empty';
      }
    }
  }
}

// ══ TÂCHES ══════════════════════════════════════════════
function showTasks(key){
  const t=TASKS[key],m=META[key];
  document.getElementById('tdot').style.background=m.dot;
  document.getElementById('ttxt').textContent=t.t;
  document.getElementById('tlist').innerHTML=t.i.map(x=>`<div class="titem">${x}</div>`).join('');
  const p=document.getElementById('tpanel'); p.style.display='block';
  p.scrollIntoView({behavior:'smooth',block:'nearest'});
}

// ══ HEURES ══════════════════════════════════════════════
function calcH(state){
  const c={};
  Object.values(state).forEach(k=>{if(k)c[k]=(c[k]||0)+1;});
  const h={};
  Object.entries(c).forEach(([k,n])=>{const m=META[k];h[k]=m.full?HOURS[k]:(n*HOURS[k]/(m.halves.length||1));});
  return h;
}

function renderHours(){
  const state=ws(weekOffset), hm=calcH(state);
  const total=Object.values(hm).reduce((a,b)=>a+b,0);
  const maxH=Math.max(...Object.values(hm),1);
  const order=['prod1','prod2','biz','insta','li','ops','admin','deca','cours'];
  let html='';
  order.forEach(k=>{
    if(!hm[k]) return;
    const m=META[k],h=hm[k],pct=Math.round(h/maxH*100);
    html+=`<div class="hrow"><div class="hdot" style="background:${m.dot}"></div><div class="hlbl">${m.label}</div><div class="hbar"><div class="hfill" style="width:${pct}%;background:${m.dot}"></div></div><div class="hval">${h%1===0?h:h.toFixed(1)}h</div></div>`;
  });
  if(!html){document.getElementById('hcontent').innerHTML='<div class="empty">Remplis ta semaine<br>pour voir les heures.</div>';return;}
  html+=`<div class="htotal"><span>Total</span><span>${total%1===0?total:total.toFixed(1)}h</span></div>`;
  document.getElementById('hcontent').innerHTML=html;
}

// ══ HISTORIQUE ══════════════════════════════════════════
function renderHist(){
  const el=document.getElementById('hcontent2');
  if(!validated.length){el.innerHTML='<div class="empty">Valide des semaines<br>pour voir l\'historique.</div>';return;}
  el.innerHTML='';
  [...validated].reverse().forEach(e=>{
    const div=document.createElement('div'); div.className='hweek';
    const chips=Object.entries(e.hours).map(([k,h])=>{const m=META[k];return`<span class="chip" style="background:${m.dot}22;color:${m.dot}">${m.label} ${h%1===0?h:h.toFixed(1)}h</span>`;}).join('');
    const total=Object.values(e.hours).reduce((a,b)=>a+b,0);
    const gcbadge=e.gcal?'<span style="font-size:10px;background:#EAF3DE;color:#27500A;padding:2px 8px;border-radius:20px;font-weight:700;">📅 GAgenda</span>':'';
    div.innerHTML=`<div class="hwtitle"><span>${e.label}</span><span style="display:flex;align-items:center;gap:6px;">${gcbadge}<span style="font-size:12px;color:var(--text3)">${total%1===0?total:total.toFixed(1)}h</span></span></div><div class="chips">${chips}</div>`;
    el.appendChild(div);
  });
}

// ══ VALIDER ═════════════════════════════════════════════
async function validateWeek(){
  const state=ws(weekOffset);
  if(!Object.keys(state).length){toast('⚠️ Semaine vide !');return;}
  const label=wlabel(weekOffset), wk=wkey(weekOffset), hm=calcH(state);
  let gcalOk=false;
  if(tokenOk()){
    toast('⏳ Envoi vers Google Agenda...');
    await deleteWeek(wk);
    const n=await pushToGcal(state);
    gcalOk=n>0;
    toast(gcalOk?`✅ ${n} événements créés dans Google Agenda !`:'⚠️ Sauvegardé localement (erreur GAgenda)');
  } else {
    toast('✅ Semaine sauvegardée (connecte Google Agenda pour sync)');
  }
  const idx=validated.findIndex(v=>v.label===label);
  const entry={label,wk,hours:hm,state:{...state},gcal:gcalOk};
  if(idx>=0) validated[idx]=entry; else validated.push(entry);
  localStorage.setItem('m2f_v',JSON.stringify(validated));
}

function clearWeek(){
  if(!confirm('Vider la semaine ?')) return;
  allWeeks[wkey(weekOffset)]={};
  save(); renderGrid(); renderHours();
  document.getElementById('tpanel').style.display='none';
  toast('🗑 Semaine vidée');
}

// ══ NAV ═════════════════════════════════════════════════
function changeWeek(d){
  weekOffset+=d;
  document.getElementById('wlbl').textContent=wlabel(weekOffset);
  closePicker(); renderGrid(); renderHours();
  document.getElementById('tpanel').style.display='none';
}

function showTab(tab,el){
  document.querySelectorAll('.pg').forEach(p=>p.classList.remove('on'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  document.getElementById('pg-'+tab).classList.add('on');
  el.classList.add('on');
  if(tab==='hours') renderHours();
  if(tab==='hist')  renderHist();
}

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  setTimeout(()=>t.classList.remove('on'),3000);
}

function banner(msg,type){
  const b=document.getElementById('banner');
  b.textContent=msg; b.className='banner on '+type;
  setTimeout(()=>b.classList.remove('on'),7000);
}

if(location.search.includes('code=')) pkceCallback();
document.getElementById('wlbl').textContent=wlabel(0);
updateAuthBtn();
renderBlocs();
renderGrid();
</script>
